<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hi lol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        button {
            background-color: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }
        
        .doom {
            color: rgb(0, 0, 0);
            transition: all 0.3s;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: xx-large;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }
        .doom:hover {
            color: blue;
            transition: all 0.3s;
            font-size: x-large;
            text-decoration: none;
        }
        .doom:hover a {
            content: "dont click me";
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #498141 100%);
            background-attachment: fixed;
        }
        
        /* Add scrollable content */
        .content-spacer {
            height: 200vh;
            position: absolute;
            width: 100%;
            pointer-events: none;
        }
        
            </style>
</head>
<body>
    <div class="content-spacer"></div>
    <button><a href="https://google.com" target="_blank" class="doom">hi lol</a></button>
    
    <!-- Background Audio -->
    <audio id="backgroundMusic" loop autoplay>
        <source src="lmaosong2.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Aggressive autoplay - try everything immediately
        const audio = document.getElementById('backgroundMusic');
        audio.volume = 0.3;
        
        // Try to play immediately on page load
        function tryPlay() {
            audio.play().then(() => {
                console.log('Music playing!');
            }).catch(() => {
                console.log('Autoplay blocked, retrying...');
                setTimeout(tryPlay, 100);
            });
        }
        
        // Start trying immediately
        tryPlay();
        
        // Try on any possible user interaction
        document.addEventListener('click', tryPlay, { once: true });
        document.addEventListener('keydown', tryPlay, { once: true });
        document.addEventListener('mousemove', tryPlay, { once: true });
        document.addEventListener('scroll', tryPlay, { once: true });
        document.addEventListener('touchstart', tryPlay, { once: true });
        
        // Create an invisible overlay to catch first interaction
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;';
        document.body.appendChild(overlay);
        
        overlay.addEventListener('click', function() {
            audio.play();
            overlay.remove();
        }, { once: true });
        
        // Continuous retry loop
        setInterval(() => {
            if (audio.paused) {
                tryPlay();
            }
        }, 2000);
        
        // Fade transition function
        function fadeText(fromText, toText, duration) {
            const button = document.querySelector('button a');
            button.style.transition = `opacity ${duration / 2}ms ease-in-out`;
            
            // Fade out
            button.style.opacity = '0';
            
            // Change text and fade in
            setTimeout(() => {
                button.textContent = toText;
                button.style.opacity = '1';
            }, duration / 2);
        }
        
        // Start the fade transition after page load
        setTimeout(() => {
            fadeText('hi lol', 'ok', 2000); // 2 second transition
        }, 1000); // Start after 1 second
        
        // Second transition from ok to umm
        setTimeout(() => {
            fadeText('ok', 'umm', 2000); // 2 second transition
        }, 4000); // Start after first transition completes (1s + 2s + 1s buffer)

        // Second transition from ok to umm
        setTimeout(() => {
            fadeText('umm', 'uhh', 2000); // 2 second transition
        }, 7000); // Start after first transition completes (1s + 2s + 1s buffer)        
        // Add click event to the button

        document.querySelector('button').addEventListener('click', function(e) {
            e.preventDefault();
            tryPlay(); // Try to play music
        });
        
            </script>
</body>
</html>
