<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hi lol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        button {
            background-color: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }
        
        .doom {
            color: rgb(0, 0, 0);
            transition: all 0.3s;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: xx-large;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }
        .doom:hover {
            color: blue;
            transition: all 0.3s;
            font-size: x-large;
            text-decoration: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #498141 100%);
            background-attachment: fixed;
        }
        
        /* Add scrollable content */
        .content-spacer {
            height: 200vh;
            position: absolute;
            width: 100%;
            pointer-events: none;
        }
        
        /* Confetti styles */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(var(--horizontal-movement, 0px)) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* Giant 3D text styles */
        .giant-text {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            font-weight: 900;
            color: #ff6b6b;
            white-space: nowrap;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            z-index: 1000;
            animation: giant-land 2s ease-out forwards;
            pointer-events: none;
        }
        
        @keyframes giant-land {
            0% {
                top: -200px;
                transform: translateX(-50%) scale(0.5);
                opacity: 0;
            }
            100% {
                top: 50vh;
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }
        
        /* Shaking image styles */
        .shaking-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: auto;
            max-height: 400px;
            z-index: 2000;
            animation: fadeIn 0.5s ease-out forwards;
            pointer-events: none;
        }
        
        .shaking-image.shaking {
            animation: shake 2s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            25% { transform: translate(-51%, -50%) rotate(-1deg) scale(1.01); }
            50% { transform: translate(-49%, -50%) rotate(1deg) scale(0.99); }
            75% { transform: translate(-51%, -50%) rotate(-1deg) scale(1.01); }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
            </style>
</head>
<body>
    <div class="content-spacer"></div>
    <button><a href="https://google.com" target="_blank" class="doom">hi lol</a></button>
    
    <!-- Background Audio -->
    <audio id="backgroundMusic" loop autoplay>
        <source src="lmaosong2.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Aggressive autoplay - try everything immediately
        const audio = document.getElementById('backgroundMusic');
        audio.volume = 0.3;
        
        // Try to play immediately on page load
        function tryPlay() {
            audio.play().then(() => {
                console.log('Music playing!');
            }).catch(() => {
                console.log('Autoplay blocked, retrying...');
                setTimeout(tryPlay, 100);
            });
        }
        
        // Start trying immediately
        tryPlay();
        
        // Try on any possible user interaction
        document.addEventListener('click', tryPlay, { once: true });
        document.addEventListener('keydown', tryPlay, { once: true });
        document.addEventListener('mousemove', tryPlay, { once: true });
        document.addEventListener('scroll', tryPlay, { once: true });
        document.addEventListener('touchstart', tryPlay, { once: true });
        
        // Create an invisible overlay to catch first interaction
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;';
        document.body.appendChild(overlay);
        
        overlay.addEventListener('click', function() {
            audio.play();
            overlay.remove();
        }, { once: true });
        
        // Continuous retry loop
        setInterval(() => {
            if (audio.paused) {
                tryPlay();
            }
        }, 2000);
        
        // Static gradient - no color changes on scroll
        
        // Confetti effect function
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6ab04c', '#c7ecee', '#dfe6e9', '#00d2d3'];
            const emojis = ['😭'];
            const screenWidth = window.innerWidth;
            
            // Create colored confetti squares
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // Random position across entire screen width
                confetti.style.left = Math.random() * screenWidth + 'px';
                confetti.style.top = '-20px';
                
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                
                // Random horizontal movement
                const horizontalMovement = (Math.random() - 0.5) * 200;
                confetti.style.setProperty('--horizontal-movement', horizontalMovement + 'px');
                
                // Random animation duration and delay
                confetti.style.animationDuration = Math.random() * 1 + 1 + 's';
                confetti.style.animationDelay = Math.random() * 0.3 + 's';
                
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 2000);
            }
            
            // Create crying emojis
            for (let i = 0; i < 30; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'confetti';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Random position across entire screen width
                emoji.style.left = Math.random() * screenWidth + 'px';
                emoji.style.top = '-50px';
                
                // Emoji styling
                emoji.style.fontSize = Math.random() * 20 + 20 + 'px';
                emoji.style.background = 'transparent';
                emoji.style.width = 'auto';
                emoji.style.height = 'auto';
                
                // Random horizontal movement
                const horizontalMovement = (Math.random() - 0.5) * 200;
                emoji.style.setProperty('--horizontal-movement', horizontalMovement + 'px');
                
                // Random animation duration and delay
                emoji.style.animationDuration = Math.random() * 1 + 1 + 's';
                emoji.style.animationDelay = Math.random() * 0.3 + 's';
                
                document.body.appendChild(emoji);
                
                // Remove emoji after animation
                setTimeout(() => {
                    emoji.remove();
                }, 2000);
            }
        }
        
        // Create giant 3D text function
        function createGiantText() {
            console.log('Creating giant text...');
            
            // Hide the "hi lol" button
            const button = document.querySelector('button');
            button.style.opacity = '0';
            button.style.pointerEvents = 'none';
            
            const giantText = document.createElement('div');
            giantText.className = 'giant-text';
            giantText.textContent = 'hi facebook unc';
            giantText.style.display = 'block';
            document.body.appendChild(giantText);
            
            console.log('Giant text added:', giantText);
            
            // Remove the text after animation and show button again
            setTimeout(() => {
                console.log('Removing giant text...');
                giantText.remove();
                // Show the button again
                button.style.opacity = '1';
                button.style.pointerEvents = 'auto';
            }, 3000);
        }
        
        // Add click event to the button
        document.querySelector('button').addEventListener('click', function(e) {
            e.preventDefault();
            createConfetti();
            createGiantText();
            tryPlay(); // Also try to play music
        });
        
            </script>
</body>
</html>
